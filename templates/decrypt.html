
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Decrypt File - SecureFile</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>🔓 Decrypt File</h1>

        <p class="subtitle">
            Restore your encrypted file using the correct password
        </p>

        {% if message %}
            <p class="error">{{ message }}</p>
        {% endif %}

        <form action="/decrypt"
              method="POST"
              enctype="multipart/form-data">

            <label>Select Encrypted File</label>

            <input type="file"
                   name="file"
                   required>

            <label>Enter Password</label>

            <input type="password"
                   name="password"
                   placeholder="Enter decryption password"
                   required>

            <button type="submit" class="btn">
                🔓 Decrypt & Download
            </button>

        </form>

        <a href="/" class="back">
            ← Back to Home
        </a>

    </div>

</body>

</html>
